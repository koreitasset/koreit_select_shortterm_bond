<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>코레이트 셀렉트단기채 증권투자신탁[채권]</title>

<!-- 카카오 / 메신저 미리보기용 -->
<meta property="og:title" content="코레이트셀렉트단기채 증권투자신탁[채권]">
<meta property="og:description" content="탄탄한 기준을 딛고, 한 걸음씩 내일로!">
<meta property="og:image" content="https://koreitasset.github.io/koreit_select_shortterm_bond/01.PNG">
<meta property="og:url" content="https://koreitasset.github.io/koreit_select_shortterm_bond/">
<meta property="og:type" content="website">

<style>
body {
  margin: 0;
  background: #111;
  display: flex;
  justify-content: center;
  font-family: sans-serif;
}

.wrapper {
  width: 100%;
  max-width: 800px;
}

.page {
  position: relative;
  overflow: hidden;
  background: #fff;
}

.page .base,
#pages img {
  width: 100%;
  height: auto;
  display: block;
}

/* 확대했을 때 보이는 부분만 고해상도로 덮어 그리는 캔버스 */
.page .detail {
  position: absolute;
  display: none;
  pointer-events: none;
}

.download {
  display: block;
  margin: 16px;
  padding: 14px;
  text-align: center;
  color: #fff;
  background: #1f3a68;
  border-radius: 8px;
  text-decoration: none;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="wrapper">
  <div id="pages"></div>
  <a class="download" href="leaflet.pdf" target="_blank">PDF 원본 보기 / 다운로드</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
var PDF_FILE = 'leaflet.pdf';
var FALLBACK_IMAGES = ['01.PNG', '02.PNG'];
var BASE_QUALITY = 2;            // 기본 화면: 기기 해상도의 2배로 그림
var MAX_DETAIL_PIXELS = 8000000; // 확대용 캔버스 최대 크기(휴대폰 메모리 보호)
var box = document.getElementById('pages');
var pages = [];

function showImages() {
  box.innerHTML = '';
  FALLBACK_IMAGES.forEach(function (src, i) {
    var img = document.createElement('img');
    img.src = src;
    img.alt = '리플렛 ' + (i + 1);
    box.appendChild(img);
  });
}

function dpr() { return window.devicePixelRatio || 1; }
function zoom() { return window.visualViewport ? window.visualViewport.scale : 1; }

// 1) 페이지 전체를 기본 해상도로 그림
function renderBase(p) {
  var cssW = p.el.clientWidth || 800;
  var targetW = Math.min(cssW * dpr() * BASE_QUALITY, 3000);
  var vp = p.page.getViewport({ scale: targetW / p.pdfW });
  var c = p.base;
  c.width = Math.floor(vp.width);
  c.height = Math.floor(vp.height);
  p.baseRatio = c.width / cssW; // CSS 1px 당 캔버스 픽셀 수
  return p.page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
}

// 2) 확대 상태면 지금 화면에 보이는 영역만 확대 배율에 맞춰 다시 그림
function renderDetail(p, zoomOverride) {
  var z = zoomOverride || zoom();
  var k = dpr() * z;                      // CSS 1px 당 필요한 픽셀 수
  if (p.task) { p.task.cancel(); p.task = null; }

  if (k <= p.baseRatio * 1.05) {          // 기본 해상도로 충분
    p.detail.style.display = 'none';
    return;
  }

  var r = p.el.getBoundingClientRect();
  var vv = window.visualViewport;
  var viewL = vv ? vv.offsetLeft : 0, viewT = vv ? vv.offsetTop : 0;
  var viewW = vv ? vv.width : window.innerWidth, viewH = vv ? vv.height : window.innerHeight;
  if (zoomOverride) { viewL = 0; viewT = 0; viewW = window.innerWidth / z; viewH = window.innerHeight / z; }

  // 페이지 안에서 보이는 영역 (CSS px, 페이지 기준) + 여유분
  var pad = 40;
  var x0 = Math.max(0, viewL - r.left - pad);
  var y0 = Math.max(0, viewT - r.top - pad);
  var x1 = Math.min(r.width, viewL + viewW - r.left + pad);
  var y1 = Math.min(r.height, viewT + viewH - r.top + pad);
  if (x1 <= x0 || y1 <= y0) { p.detail.style.display = 'none'; return; }

  var w = x1 - x0, h = y1 - y0;
  if (w * h * k * k > MAX_DETAIL_PIXELS) k = Math.sqrt(MAX_DETAIL_PIXELS / (w * h));

  var s = (r.width / p.pdfW) * k;
  var vp = p.page.getViewport({ scale: s, offsetX: -x0 * k, offsetY: -y0 * k });
  var off = document.createElement('canvas');
  off.width = Math.ceil(w * k);
  off.height = Math.ceil(h * k);

  p.task = p.page.render({ canvasContext: off.getContext('2d'), viewport: vp });
  p.task.promise.then(function () {
    p.task = null;
    var d = p.detail;
    d.width = off.width;
    d.height = off.height;
    d.getContext('2d').drawImage(off, 0, 0);
    d.style.left = x0 + 'px';
    d.style.top = y0 + 'px';
    d.style.width = w + 'px';
    d.style.height = h + 'px';
    d.style.display = 'block';
    off.width = off.height = 0;
  }).catch(function () {});
}

var timer = null;
function scheduleDetail() {
  clearTimeout(timer);
  timer = setTimeout(function () { pages.forEach(function (p) { renderDetail(p); }); }, 200);
}

if (!window.pdfjsLib) {
  showImages();
} else {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  pdfjsLib.getDocument(PDF_FILE).promise.then(function (pdf) {
    var chain = Promise.resolve();
    for (var n = 1; n <= pdf.numPages; n++) {
      (function (num) {
        var el = document.createElement('div');
        el.className = 'page';
        var base = document.createElement('canvas');
        base.className = 'base';
        var detail = document.createElement('canvas');
        detail.className = 'detail';
        el.appendChild(base);
        el.appendChild(detail);
        box.appendChild(el);
        chain = chain.then(function () {
          return pdf.getPage(num).then(function (page) {
            var p = { page: page, el: el, base: base, detail: detail, pdfW: page.getViewport({ scale: 1 }).width };
            // 렌더 전에도 자리를 잡아 화면이 튀지 않게
            el.style.aspectRatio = page.getViewport({ scale: 1 }).width + ' / ' + page.getViewport({ scale: 1 }).height;
            pages.push(p);
            return renderBase(p);
          });
        });
      })(n);
    }
    return chain;
  }).then(function () {
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleDetail);
      window.visualViewport.addEventListener('scroll', scheduleDetail);
    }
    window.addEventListener('scroll', scheduleDetail);
    window.addEventListener('resize', scheduleDetail);
    scheduleDetail();
  }).catch(function () {
    showImages();
  });
}
</script>

</body>
</html>
